[project]
name = "pytdigest"
version = "0.1.4"
requires-python = ">=3.7, <4"
readme = "README.rst"
description = "Python package for *fast* TDigest calculation."
authors = [
  { name = "Tomas Protivinsky", email = "tomas.protivinsky@gmail.com" },
]
keywords = ["tdigest", "distribution", "statistics"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]
dependencies = ["numpy>=1.19.0", "pandas>=1.1.0"]

[project.urls]
Homepage = "https://github.com/protivinsky/pytdigest"
Documentation = "https://protivinsky.github.io/pytdigest"

[dependency-groups]
test = ["pytest", "statsmodels"]

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
